name: CI Static Code Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static-analysis:
    name: Lint & Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint bandit flake8

      - name: Run Premium Calculator
        run: |
          python premium_calculator.py

      - name: Run Flake8 Style Check
        run: |
          flake8 premium_calculator.py

      - name: Run Bandit Security Analysis
        run: |
          bandit -r premium_calculator.py

      - name: Run Pylint Code Quality Check
        run: |
          pylint premium_calculator.py --fail-under=9.5
